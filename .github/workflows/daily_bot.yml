name: LinkedIn Auto Job Applier - Daily Run

on:
  schedule:
    - cron: '0 3 * * *'   # 3:00 AM UTC = 8:30 AM IST daily
  workflow_dispatch:       # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Apply CI patches
        env:
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
        run: python ci_patch.py

      - name: Set up virtual display (Xvfb)
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 2

      - name: Create required directories
        run: |
          mkdir -p "all resumes/default" "all resumes/temp" "all excels" "logs/screenshots"

      - name: Verify resume
        run: |
          if [ -f "all resumes/default/resume.pdf" ]; then
            echo "✅ Resume: $(wc -c < 'all resumes/default/resume.pdf') bytes"
          else
            echo "⚠️  No resume file - bot will use LinkedIn's previously uploaded resume"
          fi

      - name: Run LinkedIn Auto Job Applier
        timeout-minutes: 330
        run: python runAiBot.py 2>&1 | tee logs/run.log
        continue-on-error: true

      - name: Print summary
        if: always()
        run: |
          echo "=== Run Summary ==="
          [ -f "all excels/all_applied_applications_history.csv" ] && echo "Applications: $(wc -l < 'all excels/all_applied_applications_history.csv')" || echo "No applications CSV found"
          echo "=== Last 40 lines ==="
          [ -f "logs/run.log" ] && tail -40 logs/run.log || echo "No log file"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: |
            logs/run.log
            all excels/
          if-no-files-found: warn
          retention-days: 30
